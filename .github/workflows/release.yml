name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repackage:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

# spec: shipyard SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      # spec: INGREDIENTS.md "Declared state" -- a push to main publishes exactly when release-needed.sh finds
      #       no release carrying this state; shipyard SKILL.md "Versioning" -- YYYYMMDD.N, derived
      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        env:
          REPACKAGE: ${{ inputs.repackage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="$(sh build/version.sh)"
          pub=no
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = push ]; then
              if [ "$REPACKAGE" = true ]; then
                pub=yes
              else
                digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
                answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$ver")"
                echo "release-needed: $answer"
                if [ "$answer" = PUBLISH ]; then pub=yes; fi
              fi
            fi
          fi
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

  # platform: build is the PR's required check, and GitHub counts a SKIPPED required check as passing,
  #           so build runs even when ver fails, and then fails first
  # spec: build/package-pkg.sh -- clang22, the pinned SDK and stevedore build and package on Linux, so
  #       no job here needs a macOS runner
  build:
    needs: ver
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The ver job succeeded
        env:
          VER: ${{ needs.ver.result }}
        run: '[ "$VER" = success ] || { echo "::error::ver ended $VER, so this build has no version to build"; exit 1; }'
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: libvimg's unit tests, on this host
        run: sh tests/c/run.sh
      - name: Build, gate and package the plug-in and its updater
        run: sh build/package-pkg.sh
      - name: Tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"
      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"
      - name: Release notes
        run: |
          set -eu
          V="${{ needs.ver.outputs.version }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$V" --version "$V" \
            --product "vintagefs" --min-os 10.9.5 --out dist/RELEASE_NOTES.md
      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file dist/RELEASE_NOTES.md --digest "$digest"
      - name: Sign the pkg and write its feed
        if: needs.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          V="${{ needs.ver.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$V"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product vintagefs --feed-dir dist \
            --channel-title "vintagefs for Mavericks" --version "$V" --pkg-url "$base/vintagefs-$V.pkg" \
            --notes-file dist/RELEASE_NOTES.md --pkg "dist/vintagefs-$V.pkg" --min-os 10.9.5
      - name: Unsigned stand-in feed (never published)
        if: needs.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "${{ needs.ver.outputs.version }}"
      - name: Artifact conformance
        run: |
          set -eu
          CL="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" components/clang22)"
          export LIPO="$CL/bin/llvm-lipo" OTOOL="$CL/bin/llvm-otool" NM="$CL/bin/llvm-nm"
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.ver.outputs.version }}")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
      - name: The feed is an upgrade
        if: needs.ver.outputs.publish == 'yes'
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/vintagefs.xml \
            --version "${{ needs.ver.outputs.version }}" --tag-glob '[0-9]*.[0-9]*'
      - uses: actions/upload-artifact@v7
        with:
          name: mavergreen-vintagefs
          path: |
            dist/*.pkg
            dist/build-info-*.txt
            dist/RELEASE_NOTES.md
            dist/*.xml
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  # spec: shipyard check 29 -- this run's own pkg, installed on Mac OS X 10.9, attaching DiskCopy 4.2 and NDIF images
  #       there and uninstalling cleanly, before publish
  # platform: mavericks-vm boots its 10.9 guest under KVM on a Linux runner; packages: write is the guest image's
  vm-test:
    needs: [ver, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-vintagefs, path: dist }
      - name: Install this run's pkg on Mac OS X 10.9 and open DiskCopy 4.2 and NDIF images with it
        uses: Mavergreen/mavericks-vm@v1
        env:
          VF_VERSION_UNDER_TEST: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: VF_VERSION_UNDER_TEST
          copyback: false
          run: sh tests/installed-smoke.sh "dist/vintagefs-$VF_VERSION_UNDER_TEST.pkg" "$VF_VERSION_UNDER_TEST"

  scan:
    needs: [ver, build]
    if: always() && needs.ver.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: mavergreen-vintagefs }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [ver, build, vm-test, scan]
    if: needs.ver.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}", artifact: mavergreen-vintagefs }

  # spec: shipyard scripts/required-checks.sh -- branch protection requires this one check per pull_request workflow
  required:
    name: required (release)
    if: always()
    needs: [ver, build, vm-test, scan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
